<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gelre Ziekenhuizen</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([52.18121850897844, 5.947182484693746], 18);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.marker([52.1818486616652, 5.946197878785601])
        .addTo(map)
        .bindPopup('Rookzone bezoekers');

    L.marker([52.18134109829427, 5.946246592315666])
        .addTo(map)
        .bindPopup('Rookzone medewerkers');
</script>

</body>
</html>
